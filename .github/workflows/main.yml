on:
#  workflow_dispatch:
  schedule:
    - cron: '27 4,8 * * *'
  push:
    branches: main

name: Fetch Lausanne airport flights data from Open Sky 

jobs:
  generate-data:
    name: update data
    runs-on: ubuntu-latest
    timeout-minutes: 97

    env:
      RENV_PATHS_ROOT: ~/.local/share/renv
      OPENSKY_USR: ${{ secrets.OPENSKY_USR }}
      OPENSKY_PWD: ${{ secrets.OPENSKY_PWD }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:

    - uses: actions/checkout@v4
    
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - uses: r-lib/actions/setup-renv@v2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssh-dev libcurl4-openssl-dev libmagick++-dev libharfbuzz-dev libfribidi-dev

    - name: Create and populate .Renviron file
      run: |
        echo usr="$OPENSKY_USR" >> ~/.Renviron
        echo pwd="$OPENSKY_PWD" >> ~/.Renviron     
      shell: bash
        
    - name: Get data
      run: Rscript -e 'source("R/save_historical_osn.R")'

    - name: Commit results
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add data_raw/*
        git commit -am "GH Actions Open Sky LSGL flights data $(date)" || echo "No changes to commit"
        git push origin master || echo "No changes to commit"
      env:
        REPO_KEY: ${{secrets.GITHUB_TOKEN}}
        username: github-actions
        
